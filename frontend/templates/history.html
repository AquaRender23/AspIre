<!DOCTYPE html>
<html>

<head>

<title>AspIre Assessment History</title>

<link rel="stylesheet" href="/static/css/history.css">

<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>


<!-- NAVBAR -->

<div class="navbar">

<div class="logo-area">
<img src="/static/images/logo.png">
<span>AspIre</span>
</div>

<div class="nav-links">

<a href="/home">Home</a>
<a class="active" href="/history">History</a>
<a href="/logout" class="logout-btn">Logout</a>

</div>

</div>



<h1 class="title">Assessment History</h1>



<!-- HISTORY CONTAINER -->

<div class="history-container">


{% for item in history %}

<div class="history-card">

<h3>
Assessment — {{ item.date }}
</h3>

<div class="career-results">

{% for r in item.results %}

<div class="career-item">
<span>{{ r.career }}</span>
<div class="score 
{% if loop.index == 1 %}green
{% elif loop.index == 2 %}yellow
{% else %}red
{% endif %}
">
{{ r.score }}%
</div>
</div>

{% endfor %}

</div>

<a href="/career_insights/{{ item.results[0].career | lower | replace(' ', '_') }}">
<button class="view-analysis">View Detailed Analysis</button>
</a>

</div>

{% endfor %}


</div>

</body>

</html>
